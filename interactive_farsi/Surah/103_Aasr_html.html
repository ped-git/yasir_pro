    <p class="text-spacing--c819cade">
      العصر
    </p>

    <p class="verse-centered--86685e6c">به نام خدا که رحمتش بی اندازه است و مهربانی اش همیشگی.</p>

    <!-- Aya 1 -->
    <p class="verse-paragraph--compact">سوگند به عصر [ظهور پیامبر اسلام] <sup>۱</sup>[که] بی تردید انسان در زیان کاری بزرگی است؛<sup>۲</sup>مگر کسانی که ایمان <span class="annotation underline ul-sides-open ul-pad-y-1px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-100" data-underline-id="p103-u0001" data-underline-groups="p103-textual-coordination-1aa1df6c2b">آورده و </span>کارهای<span class="annotation underline ul-sides-open ul-pad-y-1px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-100" data-underline-id="p103-u0002" data-underline-groups="p103-textual-coordination-1aa1df6c2b"> شایسته انجام داده اند و</span> <span class="annotation underline ul-sides-open ul-pad-y-1px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-100" data-underline-id="p103-u0003" data-underline-groups="p103-textual-coordination-1aa1df6c2b">یکدیگر را به حق توصیه نموده</span> و<span class="annotation underline ul-sides-open ul-pad-y-1px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-100" data-underline-id="p103-u0004" data-underline-groups="p103-textual-coordination-1aa1df6c2b"> به شکیبایی سفارش کرده اند.</span><sup>۳</sup>
    </p>
