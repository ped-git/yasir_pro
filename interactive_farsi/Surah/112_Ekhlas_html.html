    <p class="text-spacing--c819cade">
      الإخلاص
    </p>

    <!-- Aya 1 -->
    <p class="verse-centered--86685e6c">به نام خدا که رحمتش بی اندازه است و مهربانی اش همیشگی.</p>

    <div class="small-bullet--spaced">
      <span class="text-font--88f15df3">t </span><span> </span>بگو: او خدای یکتاست؛<sup>۱</sup>خدای بی نیاز [همه موجودات هستی که نیازمند و عین فقرند برای رفع نیازشان روی به او کنند و از حضرتش گدایی نمایند.] <sup>۲</sup>
