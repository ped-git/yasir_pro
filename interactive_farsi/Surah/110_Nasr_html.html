    <p class="text-spacing--c819cade">
      النصر
    </p>

    <p class="verse-centered--86685e6c">به نام خدا که رحمتش بی اندازه است و مهربانی اش همیشگی.</p>

    <!-- Aya 1 -->
    <p class="verse-paragraph--spaced">هنگامی<span class="annotation underline ul-sides-open ul-pad-y-3px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-180" data-underline-id="p110-u0001" data-underline-groups="p110-textual-coordination-b1f9663b33"> که یاری<span class="annotation underline ul-sides-open ul-pad-y-0px ul-pad-x-0px ul-thickness-1px ul-pattern-solid ul-color-gray-180" data-underline-id="p110-u0002" data-underline-groups="p110-textual-coordination-f6c8fc9b0b"> خدا و [آن] </span>پیروزی<span class="annotation underline ul-sides-open ul-pad-y-0px ul-pad-x-0px ul-thickness-1px ul-pattern-solid ul-color-gray-180" data-underline-id="p110-u0003" data-underline-groups="p110-textual-coordination-f6c8fc9b0b"> فرا رسد،</span></span><sup>۱</sup>و <span class="annotation underline ul-sides-open ul-pad-y-3px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-180" data-underline-id="p110-u0004" data-underline-groups="p110-textual-coordination-b1f9663b33">مردم را ببینی که گروه گروه در دین خدا درآیند،</span><sup>۲</sup>پس <span class="annotation underline ul-sides-open ul-pad-y-1px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-100" data-underline-id="p110-u0005" data-underline-groups="p110-textual-coordination-0646d3508e">پروردگارت را همراه با سپاس و ستایش </span>تسبیح<span class="annotation underline ul-sides-open ul-pad-y-1px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-100" data-underline-id="p110-u0006" data-underline-groups="p110-textual-coordination-0646d3508e"> گوی، و از او آمرزش</span> بخواه، که او همواره توبه پذیر است.<sup>۳</sup>
    </p>
