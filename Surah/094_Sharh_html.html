  <body>
    <p class="text-spacing--c819cade">
      الشرح
    </p>

    <p class="verse-centered--86685e6c">
      بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ
    </p>

    <div class="verse-paragraph--compact">
      أَلَمْ

      <div class="verse-indent-1">
        <!-- Aya 1 -->
        <p class="spacing-reset-5">
          <span class="text-font--e3949987">– </span>
          نَشْرَحْ لَكَ صَدْرَكَ<sup>۱</sup>
        </p>

        <!-- Aya 2 -->
        <p class="spacing-reset-5">
          <span class="text-font--e3949987">– </span>
          وَوَضَعْنَا عَنكَ وِزْرَكَ<sup>۲</sup>
          الَّذِي أَنقَضَ ظَهْرَكَ<sup>۳</sup>
        </p>

        <!-- Aya 4 -->
        <p class="spacing-reset-5">
          <span class="text-font--e3949987">– </span>
          وَرَفَعْنَا لَكَ ذِكْرَكَ<sup>۴</sup>
        </p>
      </div>
    </div>

    <!-- Aya 5 -->
    <p class="verse-paragraph--compact verse-layout--3848ac4e">
      فَ<span class="annotation underline ul-sides-open ul-pad-y-1px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-100">إِنَّ مَعَ الْعُسْرِ يُسْرًا</span><sup>۵</sup>
      <span class="annotation underline ul-sides-open ul-pad-y-1px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-100">إِنَّ مَعَ الْعُسْرِ يُسْرًا</span><sup>۶</sup>
    </p>

    <!-- Aya 7 -->
    <p class="verse-paragraph--spaced verse-layout--858193ba">
      فَإِذَا فَرَغْتَ فَ<span class="annotation underline ul-sides-open ul-pad-y-0px ul-pad-x-0px ul-thickness-1px ul-pattern-solid ul-color-gray-180">انصَبْ</span><sup>۷</sup>
      وَ<span class="annotation underline ul-sides-open ul-pad-y-0px ul-pad-x-0px ul-thickness-1px ul-pattern-solid ul-color-gray-180">إِلَىٰ رَبِّكَ فَارْغَب</span><sup>۸</sup>
    </p>
