    <p class="verse-centered--86685e6c">
      بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ
    </p>

    <!-- Aya 1 -->
    <p class="verse-paragraph--compact">
      لِإِيلَافِ قُرَيْشٍ<sup>۱</sup>
      إِيلَافِهِمْ رِحْلَةَ <span class="annotation underline ul-sides-open ul-pad-y-0px ul-pad-x-0px ul-thickness-1px ul-pattern-solid ul-color-gray-220">الشِّتَاءِ</span>
      وَ<span class="annotation underline ul-sides-open ul-pad-y-0px ul-pad-x-0px ul-thickness-1px ul-pattern-solid ul-color-gray-220">الصَّيْفِ</span><sup>۲</sup>
      فَلْيَعْبُدُوا رَبَّ هَـٰذَا الْبَيْتِ<sup>۳</sup>
      الَّذِي <span class="annotation underline ul-sides-open ul-pad-y-0px ul-pad-x-0px ul-thickness-1px ul-pattern-solid ul-color-gray-180">أَطْعَمَهُم مِّن جُوعٍ</span>
      وَ<span class="annotation underline ul-sides-open ul-pad-y-0px ul-pad-x-0px ul-thickness-1px ul-pattern-solid ul-color-gray-180">آمَنَهُم مِّنْ خَوْفٍ</span><sup>۴</sup>
    </p>
