    <p class="verse-paragraph--compact">
      وَالْعَصْرِ<sup>۱</sup>
      إِنَّ الْإِنسَانَ لَفِي خُسْرٍ<sup>۲</sup>
      إِلَّا الَّذِينَ <span class="annotation underline ul-sides-open ul-pad-y-1px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-100">آمَنُوا</span>
      وَ<span class="annotation underline ul-sides-open ul-pad-y-1px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-100">عَمِلُوا الصَّالِحَاتِ</span>
      وَ<span class="annotation underline ul-sides-open ul-pad-y-1px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-100">تَوَاصَوْا بِالْحَقِّ</span>
      وَ<span class="annotation underline ul-sides-open ul-pad-y-1px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-100">تَوَاصَوْا بِالصَّبْرِ</span><sup>۳</sup>
