    <p class="verse-centered--86685e6c">
      بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ
    </p>

    <!-- Aya 1 -->
    <p class="verse-paragraph--spaced">
      تَبَّتْ يَدَا <span class="annotation underline ul-sides-open ul-pad-y-0px ul-pad-x-0px ul-thickness-2px ul-pattern-dotted ul-color-gray-100">أَبِي لَهَبٍ</span> وَتَبَّ<sup>۱</sup>
      مَا أَغْنَىٰ عَنْهُ <span class="annotation underline ul-sides-open ul-pad-y-0px ul-pad-x-0px ul-thickness-1px ul-pattern-dashed ul-color-gray-100">مَالُهُ</span>
      وَ<span class="annotation underline ul-sides-open ul-pad-y-0px ul-pad-x-0px ul-thickness-1px ul-pattern-dashed ul-color-gray-100">مَا كَسَبَ</span><sup>۲</sup>
      سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ<sup>۳</sup>
      وَ<span class="annotation underline ul-sides-open ul-pad-y-0px ul-pad-x-0px ul-thickness-2px ul-pattern-dotted ul-color-gray-100">امْرَأَتُهُ</span> حَمَّالَةَ الْحَطَبِ<sup>۴</sup>
      فِي جِيدِهَا حَبْلٌ مِّن مَّسَدٍ<sup>۵</sup>
    </p>
