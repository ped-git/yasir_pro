    <p class="verse-centered--86685e6c">
      بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ
    </p>

    <!-- Aya 1 -->
    <p class="verse-paragraph--spaced">
      إِذَا <span class="annotation underline ul-sides-open ul-pad-y-3px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-180">جَاءَ <span class="annotation underline ul-sides-open ul-pad-y-0px ul-pad-x-0px ul-thickness-1px ul-pattern-solid ul-color-gray-180">نَصْرُ اللَّهِ</span>
      وَ<span class="annotation underline ul-sides-open ul-pad-y-0px ul-pad-x-0px ul-thickness-1px ul-pattern-solid ul-color-gray-180">الْفَتْحُ</span></span><sup>۱</sup>
      وَ<span class="annotation underline ul-sides-open ul-pad-y-3px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-180">رَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا</span><sup>۲</sup>
      فَ<span class="annotation underline ul-sides-open ul-pad-y-1px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-100">سَبِّحْ بِحَمْدِ رَبِّكَ</span> وَ<span class="annotation underline ul-sides-open ul-pad-y-1px ul-pad-x-0mm ul-thickness-1px ul-pattern-solid ul-color-gray-100">اسْتَغْفِرْهُ</span> ۚ إِنَّهُ كَانَ تَوَّابًا<sup>۳</sup>
    </p>
