  <body>
    <p class="text-spacing--c819cade">
      الفلق
    </p>

    <!-- Aya 1 -->
    <p class="verse-centered--86685e6c">
      بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ
    </p>

    <div class="small-bullet--spaced">
      <span class="text-font--88f15df3">t </span><span> </span>
      قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ<sup>۱</sup>

      <div class="verse-indent-1">
        <div class="verse-group">
          <div class="connection-line--inside"></div>
          <!-- Aya 2 -->
          <p class="spacing-reset-5">
            <span class="text-font--e3949987">– </span>
            <span class="annotation underline ul-sides-open ul-thickness-1px ul-pattern-solid ul-color-currentcolor ul-image-gradient ul-gradient-to-left ul-stops-black-white ul-image-slice-1">مِن شَرِّ</span> مَا خَلَقَ<sup>۲</sup>
          </p>

          <!-- Aya 3 -->
          <p class="spacing-reset-5">
            <span class="text-font--e3949987">– </span>
            وَ<span class="annotation underline ul-sides-open ul-thickness-1px ul-pattern-solid ul-color-currentcolor ul-image-gradient ul-gradient-to-left ul-stops-black-white ul-image-slice-1">مِن شَرِّ</span> غَاسِقٍ إِذَا وَقَبَ<sup>۳</sup>
          </p>

          <!-- Aya 4 -->
          <p class="spacing-reset-5">
            <span class="text-font--e3949987">– </span>
            وَ<span class="annotation underline ul-sides-open ul-thickness-1px ul-pattern-solid ul-color-currentcolor ul-image-gradient ul-gradient-to-left ul-stops-black-white ul-image-slice-1">مِن شَرِّ</span> النَّفَّاثَاتِ فِي الْعُقَدِ<sup>۴</sup>
          </p>

          <!-- Aya 5 -->
          <p class="spacing-reset-5">
            <span class="text-font--e3949987">– </span>
            وَ<span class="annotation underline ul-sides-open ul-thickness-1px ul-pattern-solid ul-color-currentcolor ul-image-gradient ul-gradient-to-left ul-stops-black-white ul-image-slice-1">مِن شَرِّ</span> حَاسِدٍ إِذَا حَسَدَ<sup>۵</sup>

          </div>
        </div>
      </div>
