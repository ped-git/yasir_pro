    </p>

    <div class="verse-paragraph--compact">
      أَلَمْ

        <!-- Aya 1 -->
        <p class="spacing-reset-5">
          <span class="text-font--e3949987">– </span>
          نَشْرَحْ لَكَ صَدْرَكَ<sup>۱</sup>
        </p>

        <!-- Aya 2 -->
        <p class="spacing-reset-5">
          <span class="text-font--e3949987">– </span>
          وَوَضَعْنَا عَنكَ وِزْرَكَ<sup>۲</sup>
          الَّذِي أَنقَضَ ظَهْرَكَ<sup>۳</sup>
        </p>

        <!-- Aya 4 -->
        <p class="spacing-reset-5">
          <span class="text-font--e3949987">– </span>
          وَرَفَعْنَا لَكَ ذِكْرَكَ<sup>۴</sup>
        </p>
